<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行情看板</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #1c2128;
            --border: #30363d;
            --border-light: #21262d;
            --text: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --up: #f85149;
            --down: #3fb950;
            --flat: #8b949e;
            --accent: #58a6ff;
            --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Header ===== */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .logo-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--up);
            margin-right: 6px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timestamp {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 5px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font-sans);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .refresh-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .refresh-btn.loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .refresh-btn .spin {
            display: inline-block;
            font-size: 11px;
            transition: transform 0.5s;
        }

        .refresh-btn.loading .spin {
            animation: rotate 0.8s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            gap: 24px;
        }

        .tab {
            padding: 10px 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .tab:hover {
            color: var(--text-secondary);
        }

        .tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .tab-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-left: 4px;
        }

        /* ===== Summary Bar ===== */
        .summary {
            display: flex;
            gap: 0;
            padding: 10px 20px;
            background: var(--bg);
            border-bottom: 1px solid var(--border-light);
            overflow-x: auto;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 20px;
            border-right: 1px solid var(--border-light);
            margin-right: 20px;
            white-space: nowrap;
        }

        .summary-item:last-child {
            border-right: none;
        }

        .summary-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .summary-value {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
        }

        .summary-value.up { color: var(--up); }
        .summary-value.down { color: var(--down); }
        .summary-value.neutral { color: var(--text); }

        /* ===== Stock Table ===== */
        .stock-list {
            padding: 8px 0;
        }

        .stock-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-light);
            transition: background 0.15s;
            align-items: center;
        }

        .stock-row:hover {
            background: var(--surface-hover);
        }

        .stock-row-left {
            min-width: 0;
        }

        .stock-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .stock-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .stock-code {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .stock-market {
            font-size: 9px;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1px 5px;
            border-radius: 3px;
            letter-spacing: 0.5px;
        }

        .stock-metrics {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .metric {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
        }

        .metric-value {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .metric-value.up { color: var(--up); }
        .metric-value.down { color: var(--down); }

        .stock-row-right {
            text-align: right;
            min-width: 90px;
        }

        .stock-price {
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.2;
        }

        .stock-change {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
        }

        .stock-change.up { color: var(--up); }
        .stock-change.down { color: var(--down); }
        .stock-change.flat { color: var(--flat); }

        /* ===== Range Bar ===== */
        .range-section {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border-light);
        }

        .range-bar {
            position: relative;
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: visible;
        }

        .range-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--down) 0%, #d29922 50%, var(--up) 100%);
            border-radius: 2px;
        }

        .range-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 7px;
            height: 7px;
            background: var(--text);
            border-radius: 50%;
            box-shadow: 0 0 0 2px var(--bg);
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 3px;
        }

        .range-label-text {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-muted);
        }

        /* ===== States ===== */
        .loading-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: rotate 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--up);
            font-size: 13px;
        }

        .error-state-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .hidden { display: none !important; }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 10px;
            border-top: 1px solid var(--border-light);
        }

        /* ===== Mobile ===== */
        @media (max-width: 640px) {
            .header { padding: 10px 16px; }
            .tabs { padding: 0 16px; gap: 20px; }
            .summary { padding: 8px 16px; }
            .stock-row { padding: 10px 16px; grid-template-columns: 1fr auto; }
            .stock-metrics { gap: 12px; }
            .stock-price { font-size: 15px; }
            .logo { font-size: 14px; }
            .timestamp { display: none; }
            .refresh-btn { padding: 4px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo"><span class="logo-dot"></span>行情看板</div>
        </div>
        <div class="header-right">
            <span class="timestamp" id="updateTime">--</span>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">
                <span class="spin">⟳</span> 刷新
            </button>
        </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
        <button class="tab active" onclick="switchTab('a')" id="tabA">A股/港股<span class="tab-badge" id="badgeA">10</span></button>
        <button class="tab" onclick="switchTab('us')" id="tabUs">美股<span class="tab-badge" id="badgeUs">17</span></button>
    </nav>

    <!-- Panel A -->
    <div id="panelA">
        <div class="summary" id="summaryA"></div>
        <div class="stock-list" id="listA"></div>
        <div class="loading-state hidden" id="loadingA">
            <div class="loading-spinner"></div>
            <p>加载中...</p>
        </div>
    </div>

    <!-- Panel US -->
    <div id="panelUs" class="hidden">
        <div class="summary" id="summaryUs"></div>
        <div class="stock-list" id="listUs"></div>
        <div class="loading-state hidden" id="loadingUs">
            <div class="loading-spinner"></div>
            <p>加载中...</p>
        </div>
    </div>

    <footer class="footer">数据来源：腾讯财经 · 仅供参考</footer>

    <script>
        let currentTab = 'a';
        let aShareData = null;
        let usStockData = null;

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabA').classList.toggle('active', tab === 'a');
            document.getElementById('tabUs').classList.toggle('active', tab === 'us');
            document.getElementById('panelA').classList.toggle('hidden', tab !== 'a');
            document.getElementById('panelUs').classList.toggle('hidden', tab !== 'us');
            updateTimeDisplay();
        }

        function fmtNum(val, d = 2) {
            if (val === null || val === undefined) return '--';
            if (typeof val === 'string') return val;
            return val.toFixed(d);
        }

        function fmtPct(val) {
            if (val === null || val === undefined) return '--';
            const s = val.toFixed(2);
            return val > 0 ? '+' + s + '%' : s + '%';
        }

        function changeClass(val) {
            if (val === null || val === undefined || val === 0) return 'flat';
            return val > 0 ? 'up' : 'down';
        }

        function calcOverview(stocks) {
            const valid = stocks.filter(s => !s.error && typeof s.change_pct === 'number');
            if (valid.length === 0) return { up: 0, down: 0, flat: 0, avg: 0, total: stocks.length, valid: 0 };
            const up = valid.filter(s => s.change_pct > 0).length;
            const down = valid.filter(s => s.change_pct < 0).length;
            const flat = valid.length - up - down;
            const avg = valid.reduce((s, x) => s + x.change_pct, 0) / valid.length;
            return { up, down, flat, avg, total: stocks.length, valid: valid.length };
        }

        function renderSummary(ov, id) {
            document.getElementById(id).innerHTML = `
                <div class="summary-item">
                    <span class="summary-label">上涨</span>
                    <span class="summary-value up">${ov.up}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">下跌</span>
                    <span class="summary-value down">${ov.down}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">平盘</span>
                    <span class="summary-value neutral">${ov.flat}</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">均值</span>
                    <span class="summary-value ${changeClass(ov.avg)}">${fmtPct(ov.avg)}</span>
                </div>
            `;
        }

        function calcPos(price, low, high) {
            if (!price || !low || !high || high === low) return 50;
            return Math.max(0, Math.min(100, (price - low) / (high - low) * 100));
        }

        function renderAStocks(data) {
            const list = document.getElementById('listA');
            list.innerHTML = data.stocks.map(s => {
                if (s.error) {
                    return `<div class="stock-row">
                        <div class="stock-row-left">
                            <div class="stock-name-row">
                                <span class="stock-name">${s.name}</span>
                                <span class="stock-code">${s.code}</span>
                                <span class="stock-market">${s.market}</span>
                            </div>
                            <span class="metric-value" style="color:var(--text-muted)">${s.error}</span>
                        </div>
                    </div>`;
                }
                const cls = changeClass(s.change_pct);
                const mktCls = s.market === 'A股' ? 'A' : 'HK';
                const pos = calcPos(s.price, s.year_low, s.year_high);
                return `<div class="stock-row">
                    <div class="stock-row-left">
                        <div class="stock-name-row">
                            <span class="stock-name">${s.name}</span>
                            <span class="stock-code">${s.code}</span>
                            <span class="stock-market">${mktCls}</span>
                        </div>
                        <div class="stock-metrics">
                            <div class="metric"><span class="metric-label">PE</span><span class="metric-value">${s.pe_ttm ?? '--'}</span></div>
                            <div class="metric"><span class="metric-label">YTD</span><span class="metric-value ${changeClass(s.ytd_change)}">${fmtPct(s.ytd_change)}</span></div>
                            <div class="metric"><span class="metric-label">↓高点</span><span class="metric-value down">${fmtPct(s.drawdown)}</span></div>
                            <div class="metric"><span class="metric-label">↑低点</span><span class="metric-value up">${fmtPct(s.rally)}</span></div>
                        </div>
                        <div class="range-section">
                            <div class="range-bar">
                                <div class="range-fill" style="width:100%"></div>
                                <div class="range-dot" style="left:${pos}%"></div>
                            </div>
                            <div class="range-labels">
                                <span class="range-label-text">${fmtNum(s.year_low)}</span>
                                <span class="range-label-text">近一年 ${fmtNum(s.year_high)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="stock-row-right">
                        <div class="stock-price">${fmtNum(s.price)}</div>
                        <div class="stock-change ${cls}">${fmtPct(s.change_pct)}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderUsStocks(data) {
            const list = document.getElementById('listUs');
            list.innerHTML = data.stocks.map(s => {
                if (s.error) {
                    return `<div class="stock-row">
                        <div class="stock-row-left">
                            <div class="stock-name-row">
                                <span class="stock-name">${s.name}</span>
                                <span class="stock-code">${s.ticker}</span>
                                <span class="stock-market">US</span>
                            </div>
                            <span class="metric-value" style="color:var(--text-muted)">${s.error}</span>
                        </div>
                    </div>`;
                }
                const cls = changeClass(s.change_pct);
                const pos = calcPos(s.price, s.week52_low, s.week52_high);
                return `<div class="stock-row">
                    <div class="stock-row-left">
                        <div class="stock-name-row">
                            <span class="stock-name">${s.name}</span>
                            <span class="stock-code">${s.ticker}</span>
                            <span class="stock-market">US</span>
                        </div>
                        <div class="stock-metrics">
                            <div class="metric"><span class="metric-label">PE</span><span class="metric-value">${s.pe_ttm ?? '--'}</span></div>
                            <div class="metric"><span class="metric-label">YTD</span><span class="metric-value ${changeClass(s.ytd_change)}">${fmtPct(s.ytd_change)}</span></div>
                            <div class="metric"><span class="metric-label">↓高点</span><span class="metric-value down">${fmtPct(s.drawdown)}</span></div>
                            <div class="metric"><span class="metric-label">↑低点</span><span class="metric-value up">${fmtPct(s.rally)}</span></div>
                        </div>
                        <div class="range-section">
                            <div class="range-bar">
                                <div class="range-fill" style="width:100%"></div>
                                <div class="range-dot" style="left:${pos}%"></div>
                            </div>
                            <div class="range-labels">
                                <span class="range-label-text">${fmtNum(s.week52_low)}</span>
                                <span class="range-label-text">52周 ${fmtNum(s.week52_high)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="stock-row-right">
                        <div class="stock-price">${fmtNum(s.price)}</div>
                        <div class="stock-change ${cls}">${fmtPct(s.change_pct)}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function updateTimeDisplay() {
            const el = document.getElementById('updateTime');
            const d = currentTab === 'a' ? aShareData : usStockData;
            el.textContent = d && d.update_time ? d.update_time : '--';
        }

        async function loadData(type, useApi = true) {
            const loadingId = type === 'a' ? 'loadingA' : 'loadingUs';
            const listId = type === 'a' ? 'listA' : 'listUs';
            const summaryId = type === 'a' ? 'summaryA' : 'summaryUs';

            document.getElementById(loadingId).classList.remove('hidden');
            document.getElementById(listId).innerHTML = '';
            document.getElementById(summaryId).innerHTML = '';

            try {
                let data;
                if (useApi) {
                    const resp = await fetch(`/api/quotes?type=${type}`);
                    if (!resp.ok) throw new Error('API');
                    data = await resp.json();
                } else {
                    const url = type === 'a' ? 'data/a_share.json' : 'data/us_stock.json';
                    const resp = await fetch(url + '?t=' + Date.now());
                    if (!resp.ok) throw new Error('JSON');
                    data = await resp.json();
                }
                if (type === 'a') {
                    aShareData = data;
                    renderAStocks(data);
                } else {
                    usStockData = data;
                    renderUsStocks(data);
                }
                renderSummary(calcOverview(data.stocks), summaryId);
                updateTimeDisplay();
            } catch (err) {
                if (useApi) return loadData(type, false);
                document.getElementById(listId).innerHTML = `<div class="error-state">加载失败<span class="error-state-hint">稍后重试</span></div>`;
            } finally {
                document.getElementById(loadingId).classList.add('hidden');
            }
        }

        async function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('loading');
            await Promise.all([loadData('a', true), loadData('us', true)]);
            btn.classList.remove('loading');
        }

        init();
        async function init() {
            await Promise.all([loadData('a', true), loadData('us', true)]);
        }
    </script>
</body>
</html>
