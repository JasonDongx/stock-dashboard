<!DOCTYPE html>

    <title>行情看板 · Stock Dashboard</title>
    <style>
        * {
            margin: 0;

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        /* 主体容器 */
        .container {

        /* 标签切换 */
        .tabs {

        /* 概览统计 */
        .overview {

        /* 股票网格 */
        .stock-grid {
            display: grid;

        .stock-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

        .stock-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);

        .stock-header {
            display: flex;

            align-items: flex-start;
            margin-bottom: 16px;

        .stock-info h3 {

        .stock-info .market-tag {
            display: inline-block;

        .market-tag.a {

        }

        .change.down {
            color: #43a047;

        .change.flat {
            color: #999;

        /* 指标行 */
        .metrics {
            border-top: 1px solid #f0f0f0;
            padding-top: 14px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .metric-row:last-child {
            margin-bottom: 0;
        }

        .metric-label {
            color: #999;
        }

        .metric-value {
            color: #333;
            font-weight: 500;
        }

        .metric-value.up {
            color: #e53935;
        }

        .metric-value.down {
            color: #43a047;
        }

        /* 进度条 */
        .range-bar {
            margin-top: 12px;
        }

        .range-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #bbb;
            margin-bottom: 4px;
        }

        .bar-container {
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;

            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #43a047 0%, #ffc107 50%, #e53935 100%);

        .bar-dot {
            position: absolute;
            top: 50%;

            background: white;

            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        /* 加载状态 */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        /* 错误状态 */
        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: #e53935;
        }

        /* 隐藏 */
        .hidden {
            display: none !important;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 32px;
            color: #aaa;
            font-size: 12px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header {
                padding: 16px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                padding: 16px;
            }

            .stock-grid {
                grid-template-columns: 1fr;
            }

            .overview {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-content">
            <h1>📈 行情看板 <span>Stock Dashboard</span></h1>
            <div class="header-right">
                <span class="update-time" id="updateTime">数据更新中...</span>
                <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">
                    <span class="icon">⟳</span> 刷新数据
                </button>
            </div>
        </div>
    </header>

    <!-- 主体 -->
    <main class="container">
        <!-- 标签切换 -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('a')" id="tabA">🇨🇳 A股/港股</button>
            <button class="tab" onclick="switchTab('us')" id="tabUs">🇺🇸 美股</button>
        </div>

        <!-- A股/港股面板 -->
        <div id="panelA">
            <div class="overview" id="overviewA"></div>
            <div class="stock-grid" id="stockGridA"></div>
            <div class="loading-state hidden" id="loadingA">
                <div class="loading-spinner"></div>
                <p>正在加载 A股/港股 行情数据...</p>
            </div>
        </div>

        <!-- 美股面板 -->
        <div id="panelUs" class="hidden">
            <div class="overview" id="overviewUs"></div>
            <div class="stock-grid" id="stockGridUs"></div>
            <div class="loading-state hidden" id="loadingUs">
                <div class="loading-spinner"></div>
                <p>正在加载 美股 行情数据...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        数据来源：腾讯财经 · 仅供参考，不构成投资建议
    </footer>

    <script>
        let currentTab = 'a';
        let aShareData = null;
        let usStockData = null;

        // 切换标签
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabA').classList.toggle('active', tab === 'a');
            document.getElementById('tabUs').classList.toggle('active', tab === 'us');
            document.getElementById('panelA').classList.toggle('hidden', tab !== 'a');
            document.getElementById('panelUs').classList.toggle('hidden', tab !== 'us');
            updateTimeDisplay();
        }

        // 格式化数字
        function formatNum(val, decimals = 2) {
            if (val === null || val === undefined) return '—';
            if (typeof val === 'string') return val;
            return val.toFixed(decimals);
        }

        // 格式化带正负号的百分比
        function formatPct(val) {
            if (val === null || val === undefined) return '—';
            const str = val.toFixed(2);
            return val > 0 ? '+' + str + '%' : str + '%';
        }

        // 获取涨跌类名
        function getChangeClass(val) {
            if (val === null || val === undefined || val === 0) return 'flat';
            return val > 0 ? 'up' : 'down';
        }

        // 计算概览统计
        function calcOverview(stocks) {
            const valid = stocks.filter(s => !s.error && typeof s.change_pct === 'number');
            if (valid.length === 0) return { up: 0, down: 0, avg: 0, total: stocks.length };

            const up = valid.filter(s => s.change_pct > 0).length;
            const down = valid.filter(s => s.change_pct < 0).length;
            const avg = valid.reduce((sum, s) => sum + s.change_pct, 0) / valid.length;

            return { up, down, flat: valid.length - up - down, avg, total: stocks.length, valid: valid.length };
        }

        // 渲染概览
        function renderOverview(overview, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">股票总数</div>
                    <div class="stat-value">${overview.total} <span style="font-size:14px;color:#999;font-weight:400;">只</span></div>
                    <div class="stat-sub">有效数据 ${overview.valid || 0} 只</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">上涨</div>
                    <div class="stat-value up">${overview.up} <span style="font-size:14px;color:#999;font-weight:400;">只</span></div>
                    <div class="stat-sub">占比 ${overview.valid ? Math.round(overview.up / overview.valid * 100) : 0}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">下跌</div>
                    <div class="stat-value down">${overview.down} <span style="font-size:14px;color:#999;font-weight:400;">只</span></div>
                    <div class="stat-sub">占比 ${overview.valid ? Math.round(overview.down / overview.valid * 100) : 0}%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">平均涨跌幅</div>
                    <div class="stat-value ${getChangeClass(overview.avg)}">${formatPct(overview.avg)}</div>
                    <div class="stat-sub">算术平均</div>
                </div>
            `;
        }

        // 计算价格在区间中的位置百分比
        function calcPosition(price, low, high) {
            if (!price || !low || !high || high === low) return 50;
            const pos = (price - low) / (high - low) * 100;
            return Math.max(0, Math.min(100, pos));
        }

        // 渲染A股/港股股票卡片
        function renderAStocks(data) {
            const grid = document.getElementById('stockGridA');
            const stocks = data.stocks;

            grid.innerHTML = stocks.map(stock => {
                if (stock.error) {
                    return `
                        <div class="stock-card">
                            <div class="stock-header">
                                <div class="stock-info">
                                    <h3>${stock.name}</h3>
                                    <span class="code">${stock.code}</span>
                                </div>
                            </div>
                            <div class="error-state" style="padding: 20px 0;">${stock.error}</div>
                        </div>
                    `;
                }

                const changeClass = getChangeClass(stock.change_pct);
                const marketClass = stock.market === 'A股' ? 'a' : 'hk';
                const pos = calcPosition(stock.price, stock.year_low, stock.year_high);

                return `
                    <div class="stock-card">
                        <div class="stock-header">
                            <div class="stock-info">
                                <h3>${stock.name} <span class="market-tag ${marketClass}">${stock.market}</span></h3>
                                <span class="code">${stock.code}</span>
                            </div>
                            <div class="stock-price">
                                <div class="price">${formatNum(stock.price)}<span style="font-size:12px;color:#999;font-weight:400;margin-left:2px;">${stock.currency}</span></div>
                                <div class="change ${changeClass}">${formatPct(stock.change_pct)}</div>
                            </div>
                        </div>
                        <div class="metrics">
                            <div class="metric-row">
                                <span class="metric-label">市盈率 TTM</span>
                                <span class="metric-value">${stock.pe_ttm !== null && stock.pe_ttm !== undefined ? stock.pe_ttm : '—'}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">今年来涨幅</span>
                                <span class="metric-value ${getChangeClass(stock.ytd_change)}">${formatPct(stock.ytd_change)}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">距高点回落</span>
                                <span class="metric-value down">${formatPct(stock.drawdown)}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">距低点涨幅</span>
                                <span class="metric-value up">${formatPct(stock.rally)}</span>
                            </div>
                            <div class="range-bar">
                                <div class="range-label">
                                    <span>${formatNum(stock.year_low)}</span>
                                    <span>近一年区间</span>
                                    <span>${formatNum(stock.year_high)}</span>
                                </div>
                                <div class="bar-container">
                                    <div class="bar-fill" style="width: 100%;">
                                        <div class="bar-dot" style="left: ${pos}%;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染美股股票卡片
        function renderUsStocks(data) {
            const grid = document.getElementById('stockGridUs');
            const stocks = data.stocks;

            grid.innerHTML = stocks.map(stock => {
                if (stock.error) {
                    return `
                        <div class="stock-card">
                            <div class="stock-header">
                                <div class="stock-info">
                                    <h3>${stock.name}</h3>
                                    <span class="code">${stock.ticker}</span>
                                </div>
                            </div>
                            <div class="error-state" style="padding: 20px 0;">${stock.error}</div>
                        </div>
                    `;
                }

                const changeClass = getChangeClass(stock.change_pct);
                const pos = calcPosition(stock.price, stock.week52_low, stock.week52_high);

                return `
                    <div class="stock-card">
                        <div class="stock-header">
                            <div class="stock-info">
                                <h3>${stock.name} <span class="market-tag us">美股</span></h3>
                                <span class="code">${stock.ticker}</span>
                            </div>
                            <div class="stock-price">
                                <div class="price">${formatNum(stock.price)}<span style="font-size:12px;color:#999;font-weight:400;margin-left:2px;">美元</span></div>
                                <div class="change ${changeClass}">${formatPct(stock.change_pct)}</div>
                            </div>
                        </div>
                        <div class="metrics">
                            <div class="metric-row">
                                <span class="metric-label">市盈率 TTM</span>
                                <span class="metric-value">${stock.pe_ttm !== null && stock.pe_ttm !== undefined ? stock.pe_ttm : '—'}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">今年来涨幅</span>
                                <span class="metric-value ${getChangeClass(stock.ytd_change)}">${formatPct(stock.ytd_change)}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">距高点回撤</span>
                                <span class="metric-value down">${formatPct(stock.drawdown)}</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">距低点涨幅</span>
                                <span class="metric-value up">${formatPct(stock.rally)}</span>
                            </div>
                            <div class="range-bar">
                                <div class="range-label">
                                    <span>${formatNum(stock.week52_low)}</span>
                                    <span>52周区间</span>
                                    <span>${formatNum(stock.week52_high)}</span>
                                </div>
                                <div class="bar-container">
                                    <div class="bar-fill" style="width: 100%;">
                                        <div class="bar-dot" style="left: ${pos}%;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 更新时间显示
        function updateTimeDisplay() {
            const timeEl = document.getElementById('updateTime');
            const data = currentTab === 'a' ? aShareData : usStockData;
            if (data && data.update_time) {
                timeEl.textContent = '🕐 最后更新：' + data.update_time;
            } else {
                timeEl.textContent = '数据更新中...';
            }
        }

        // 加载数据：优先调用 API，回退到静态 JSON
        async function loadData(type, useApi = true) {
            const loadingId = type === 'a' ? 'loadingA' : 'loadingUs';
            const gridId = type === 'a' ? 'stockGridA' : 'stockGridUs';
            const overviewId = type === 'a' ? 'overviewA' : 'overviewUs';

            document.getElementById(loadingId).classList.remove('hidden');
            document.getElementById(gridId).innerHTML = '';
            document.getElementById(overviewId).innerHTML = '';

            try {
                let data;
                if (useApi) {
                    // 调用 Vercel Serverless Function 获取实时数据
                    const apiUrl = `/api/quotes?type=${type}`;
                    const resp = await fetch(apiUrl);
                    if (!resp.ok) throw new Error('API请求失败');
                    data = await resp.json();
                } else {
                    // 回退：读取静态 JSON 文件
                    const url = type === 'a' ? 'data/a_share.json' : 'data/us_stock.json';
                    const resp = await fetch(url + '?t=' + Date.now());
                    if (!resp.ok) throw new Error('数据加载失败');
                    data = await resp.json();
                }

                if (type === 'a') {
                    aShareData = data;
                    renderAStocks(data);
                    renderOverview(calcOverview(data.stocks), 'overviewA');
                } else {
                    usStockData = data;
                    renderUsStocks(data);
                    renderOverview(calcOverview(data.stocks), 'overviewUs');
                }

                updateTimeDisplay();
            } catch (err) {
                if (useApi) {
                    // API 失败，尝试静态 JSON 回退
                    return loadData(type, false);
                }
                document.getElementById(gridId).innerHTML = `
                    <div class="error-state" style="grid-column: 1/-1;">
                        <p>❌ 数据加载失败：${err.message}</p>
                        <p style="font-size:12px;margin-top:8px;">刷新试试，或稍后再来</p>
                    </div>
                `;
            } finally {
                document.getElementById(loadingId).classList.add('hidden');
            }
        }

        // 刷新数据：调用 API 获取最新行情
        async function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('loading');

            await Promise.all([loadData('a', true), loadData('us', true)]);

            btn.classList.remove('loading');
        }

        // 初始化
        async function init() {
            await Promise.all([loadData('a'), loadData('us')]);
        }

        init();
    </script>
</body>
</html>
